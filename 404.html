<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — SmartCartaz</title>
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .logo-404 {
            height: 40px;
            margin-top: 8px;
        }
        .conteudo-404 {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .conteudo-404 > a {
            margin-top: 8px;
            background-color: var(--brand);
            color: var(--white);
            text-decoration: none;
            border-radius: 4px;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
    <img src="src/img/logo-smartcartaz.svg" alt="Logo SmartCartaz" class="logo-404">
    <div class="conteudo-404">
        <img src="/src/img/garden--file-error-fill-16.svg" alt="Ícone de arquivo com um X no meio." style="height: 48px; margin-bottom: 16px;">
        <h2 class="title" style="font-size: 24px;">Página não encontrada</h2>
        <p class="text" style="font-size: 16px;">O endereço que você tentou acessar<br>não existe ou foi movido.</p>
        <a href="/" class="label">Criar um cartaz</a>
    </div>
</body>
</html>
